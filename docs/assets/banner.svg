      <stop offset="0" stop-color="#0b1320"/>
      <stop offset="0.55" stop-color="#132238"/>
      <stop offset="1" stop-color="#1d1a2e"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a541"/>
      <stop offset="1" stop-color="#e4572e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#f2a541" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2a541" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#sky)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
